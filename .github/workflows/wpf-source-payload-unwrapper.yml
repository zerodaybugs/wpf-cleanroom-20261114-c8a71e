name: WPF Source Payload Unwrapper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unwrap:
    runs-on: ubuntu-latest
    env:
      PAYLOAD_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
      WRAP_PUBLIC_PEM_B64: 

    steps:
      - uses: actions/checkout@v4

      - name: Decrypt and verify exact WPF source payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered wrapped
          base64 -d wpf-payload-v3-cipher.b64 > source.enc
          actual_cipher="$(sha256sum source.enc | awk '{print $1}')"
          expected_cipher="$(tr -d '\r\n ' < payload-v3.cipher.sha256)"
          test "${actual_cipher}" = "${expected_cipher}"
          printf '%s' "${PAYLOAD_KEY_B64}" | base64 -d > payload.key
          test "$(stat -c%s payload.key)" -eq 32
          base64 -d payload-v3.iv.b64 > payload.iv
          test "$(stat -c%s payload.iv)" -eq 16
          openssl enc -d -aes-256-cbc \
            -K "$(xxd -p -c 256 payload.key)" \
            -iv "$(xxd -p -c 256 payload.iv)" \
            -in source.enc -out source.zip
          actual_plain="$(sha256sum source.zip | awk '{print $1}')"
          expected_plain="$(tr -d '\r\n ' < payload-v3.plain.sha256)"
          test "${actual_plain}" = "${expected_plain}"
          unzip -q source.zip -d recovered
          test -s recovered/wpf-cleanroom-payload-v2/PAYLOAD_PROVENANCE.json
          printf 'SOURCE_CIPHER_SHA256=%s\nSOURCE_PLAIN_SHA256=%s\nGITHUB_SHA=%s\n' \
            "${actual_cipher}" "${actual_plain}" "${GITHUB_SHA}" > recovered/UNWRAP_RECEIPT.txt

      - name: Re-encrypt recovered source to one-time RSA recipient
        shell: bash
        run: |
          set -euo pipefail
          zip -q -r recovered-source.zip recovered
          openssl rand 32 > wrap.key
          openssl rand 16 > wrap.iv
          openssl enc -aes-256-cbc \
            -K "$(xxd -p -c 256 wrap.key)" \
            -iv "$(xxd -p -c 256 wrap.iv)" \
            -in recovered-source.zip -out wrapped/source.enc
          printf '%s' "${WRAP_PUBLIC_PEM_B64}" | base64 -d > wrap-public.pem
          openssl pkeyutl -encrypt -pubin -inkey wrap-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -in wrap.key -out wrapped/wrap.key.enc
          cp wrap.iv wrapped/wrap.iv
          sha256sum recovered-source.zip | awk '{print $1}' > wrapped/source.plain.sha256
          sha256sum wrapped/source.enc | awk '{print $1}' > wrapped/source.cipher.sha256
          sha256sum wrapped/wrap.key.enc | awk '{print $1}' > wrapped/wrap.key.enc.sha256
          printf 'RECIPIENT_PUBLIC_KEY_SHA256=e7a30db0d7488edb3d2c3d60976edb744cd51cc48d6d84f7e733367a21f0405e\n' > wrapped/METADATA.txt

      - name: Remove plaintext and symmetric keys
        if: always()
        shell: bash
        run: |
          rm -rf recovered source.enc source.zip recovered-source.zip payload.key payload.iv wrap.key wrap-public.pem

      - name: Upload RSA-wrapped source payload
        uses: actions/upload-artifact@v4
        with:
          name: wpf-source-rsa-wrapped
          path: wrapped/
          if-no-files-found: error
          retention-days: 1
