name: WPF Base Matrix Evidence Unwrapper

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  unwrap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: net10-r1
            artifact_id: 14122641014
          - label: net10-r2
            artifact_id: 14122566127
          - label: net10-r3
            artifact_id: 14122238808
          - label: net11-r1
            artifact_id: 14122347829
    env:
      GH_TOKEN: ${{ github.token }}
      PAYLOAD_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
      WRAP_PUBLIC_PEM_B64: 

    steps:
      - name: Download and verify encrypted base evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outer evidence wrapped
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ matrix.artifact_id }}/zip" \
            -o outer.zip
          unzip -q outer.zip -d outer
          for f in evidence.enc evidence.iv.b64 evidence.plain.sha256 evidence.cipher.sha256; do test -s "outer/$f"; done
          actual_cipher="$(sha256sum outer/evidence.enc | awk '{print $1}')"
          expected_cipher="$(tr -d '\r\n ' < outer/evidence.cipher.sha256)"
          test "${actual_cipher}" = "${expected_cipher}"
          printf '%s' "${PAYLOAD_KEY_B64}" | base64 -d > payload.key
          test "$(stat -c%s payload.key)" -eq 32
          base64 -d outer/evidence.iv.b64 > payload.iv
          test "$(stat -c%s payload.iv)" -eq 16
          openssl enc -d -aes-256-cbc \
            -K "$(xxd -p -c 256 payload.key)" \
            -iv "$(xxd -p -c 256 payload.iv)" \
            -in outer/evidence.enc -out evidence.zip
          actual_plain="$(sha256sum evidence.zip | awk '{print $1}')"
          expected_plain="$(tr -d '\r\n ' < outer/evidence.plain.sha256)"
          test "${actual_plain}" = "${expected_plain}"
          unzip -q evidence.zip -d evidence
          printf 'LABEL=%s\nSOURCE_RUN_ID=43615002342\nSOURCE_ARTIFACT_ID=%s\nSOURCE_CIPHER_SHA256=%s\nSOURCE_PLAIN_SHA256=%s\n' \
            '${{ matrix.label }}' '${{ matrix.artifact_id }}' "${actual_cipher}" "${actual_plain}" \
            > evidence/UNWRAP_RECEIPT.txt

      - name: Re-encrypt recovered evidence to one-time RSA recipient
        shell: bash
        run: |
          set -euo pipefail
          zip -q -r recovered-evidence.zip evidence
          openssl rand 32 > wrap.key
          openssl rand 16 > wrap.iv
          openssl enc -aes-256-cbc \
            -K "$(xxd -p -c 256 wrap.key)" \
            -iv "$(xxd -p -c 256 wrap.iv)" \
            -in recovered-evidence.zip -out wrapped/evidence.enc
          printf '%s' "${WRAP_PUBLIC_PEM_B64}" | base64 -d > wrap-public.pem
          openssl pkeyutl -encrypt -pubin -inkey wrap-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -in wrap.key -out wrapped/wrap.key.enc
          cp wrap.iv wrapped/wrap.iv
          sha256sum recovered-evidence.zip | awk '{print $1}' > wrapped/evidence.plain.sha256
          sha256sum wrapped/evidence.enc | awk '{print $1}' > wrapped/evidence.cipher.sha256
          sha256sum wrapped/wrap.key.enc | awk '{print $1}' > wrapped/wrap.key.enc.sha256
          printf 'LABEL=%s\nSOURCE_RUN_ID=43615002342\nSOURCE_ARTIFACT_ID=%s\nRECIPIENT_PUBLIC_KEY_SHA256=e7a30db0d7488edb3d2c3d60976edb744cd51cc48d6d84f7e733367a21f0405e\n' \
            '${{ matrix.label }}' '${{ matrix.artifact_id }}' > wrapped/METADATA.txt

      - name: Remove recovered plaintext and keys
        if: always()
        shell: bash
        run: |
          rm -rf outer evidence outer.zip evidence.zip recovered-evidence.zip payload.key payload.iv wrap.key wrap-public.pem

      - name: Upload RSA-wrapped base evidence
        uses: actions/upload-artifact@v4
        with:
          name: wpf-base-rsa-wrapped-${{ matrix.label }}
          path: wrapped/
          if-no-files-found: error
          retention-days: 1
